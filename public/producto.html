<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ramo · Flor de Salada</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body data-page="producto">
  <div id="site-header"></div>

  <main class="container" id="productoRoot">
    <div class="product-detail">
      <div>
        <div class="gallery"><img id="galleryImg" src="/img/logo.svg" alt="Ramo"></div>
        <div class="gallery-thumbs" id="galleryThumbs"></div>
      </div>
      <div class="card">
        <span class="badge celeste" id="productType"></span>
        <h1 id="productTitle" style="font-size:2rem;margin-top:10px"></h1>
        <p id="productDescription" class="muted"></p>
        <div id="optionGroups"></div>
        <div class="summary-line"><span>Precio por ramo</span><span class="price" id="unitPrice">$0</span></div>
        <div class="summary-line total"><span>Total (<span id="qtyLabel">1</span> ramos)</span><span id="totalPrice">$0</span></div>
        <button class="btn btn-primary btn-block" id="addToCart" style="margin-top:14px"><svg class="icon"><use href="/img/icons.svg#cart"></use></svg> Agregar al carrito</button>
      </div>
    </div>

    <section class="section grid two">
      <div class="card">
        <h2>Dejá tu reseña</h2>
        <p class="muted" style="font-size:.88rem">Hasta 400 caracteres y podés subir fotos.</p>
        <form id="reviewForm" enctype="multipart/form-data">
          <div class="field">
            <label for="reviewText">Tu opinión</label>
            <textarea id="reviewText" name="text" maxlength="400" placeholder="Contanos qué te pareció el ramo..." required></textarea>
            <div class="counter" id="reviewCounter">0/400 caracteres</div>
          </div>
          <div class="field">
            <label for="reviewPhotos">Fotos (opcional, hasta 3)</label>
            <input id="reviewPhotos" name="photos" type="file" accept="image/*" multiple>
          </div>
          <button class="btn btn-lila btn-block" type="submit">Publicar reseña</button>
        </form>
      </div>
      <div class="card">
        <h2>Reseñas</h2>
        <div id="reviewsList"></div>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>
  <script src="/js/api.js"></script>
  <script src="/js/cart.js"></script>
  <script src="/js/layout.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
