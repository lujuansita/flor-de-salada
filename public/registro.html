<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Registrarse · Flor de Salada</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body data-page="registro">
  <div id="site-header"></div>

  <main class="container narrow">
    <div class="card">
      <h1 style="font-size:2rem">Creá tu cuenta <svg class="icon" style="vertical-align:-3px"><use href="/img/icons.svg#flower"></use></svg></h1>
      <p class="muted">Vas a poder comprar, opinar y seguir tus pedidos.</p>
      <form id="registerForm">
        <div class="field"><label for="name">Nombre</label><input id="name" name="name" required placeholder="Tu nombre"></div>
        <div class="field"><label for="email">Email</label><input id="email" name="email" type="email" required placeholder="tu@email.com"></div>
        <div class="field"><label for="password">Contraseña</label><input id="password" name="password" type="password" required minlength="6"></div>
        <div class="field"><label for="companySelect">Empresa / tienda</label><select id="companySelect" name="companySlug"></select></div>
        <button class="btn btn-primary btn-block" type="submit">Registrarme</button>
      </form>
      <p class="muted center" style="margin-top:16px">¿Ya tenés cuenta? <a href="/login.html" style="color:var(--plum);font-weight:bold">Ingresá</a></p>
    </div>
  </main>

  <div id="site-footer"></div>
  <script src="/js/api.js"></script>
  <script src="/js/cart.js"></script>
  <script src="/js/layout.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
