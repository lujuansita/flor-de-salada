<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Usuarios · Flor de Salada</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body data-page="panel" data-panel="usuarios">
  <div id="site-header"></div>

  <main class="container">
    <div class="panel-layout">
      <aside class="sidebar">
        <a href="/panel/index.html"><svg class="icon"><use href="/img/icons.svg#chart"></use></svg> Resumen</a>
        <a href="/panel/productos.html"><svg class="icon"><use href="/img/icons.svg#flower"></use></svg> Productos</a>
        <a href="/panel/pedidos.html"><svg class="icon"><use href="/img/icons.svg#box"></use></svg> Pedidos</a>
        <a href="/panel/usuarios.html"><svg class="icon"><use href="/img/icons.svg#users"></use></svg> Usuarios</a>
        <a href="/panel/resenas.html"><svg class="icon"><use href="/img/icons.svg#star"></use></svg> Reseñas</a>
        <a href="/panel/empresas.html"><svg class="icon"><use href="/img/icons.svg#building"></use></svg> Empresas</a>
      </aside>
      <div id="panelRoot">
        <h1>Usuarios de la empresa</h1>
        <p class="subtitle">Creá compradores y administradores de tu cuenta.</p>

        <div class="card" style="margin-bottom:24px">
          <h3>Nuevo usuario</h3>
          <form id="userForm">
            <div class="grid two">
              <div class="field"><label for="uname">Nombre</label><input id="uname" name="name" required></div>
              <div class="field"><label for="uemail">Email</label><input id="uemail" name="email" type="email" required></div>
            </div>
            <div class="grid two">
              <div class="field"><label for="upassword">Contraseña</label><input id="upassword" name="password" type="password" required minlength="6"></div>
              <div class="field">
                <label for="urole">Rol</label>
                <select id="urole" name="role"><option value="buyer">Comprador</option><option value="admin">Administrador</option></select>
              </div>
            </div>
            <button class="btn btn-primary btn-block" type="submit">Crear usuario</button>
          </form>
        </div>

        <div class="card">
          <div class="table-wrap">
            <table>
              <thead><tr><th>Nombre</th><th>Email</th><th>Rol</th></tr></thead>
              <tbody id="userList"></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </main>

  <div id="site-footer"></div>
  <script src="/js/api.js"></script>
  <script src="/js/cart.js"></script>
  <script src="/js/layout.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
