<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Empresas · Flor de Salada</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body data-page="panel" data-panel="empresas">
  <div id="site-header"></div>

  <main class="container">
    <div class="panel-layout">
      <aside class="sidebar">
        <a href="/panel/index.html"><svg class="icon"><use href="/img/icons.svg#chart"></use></svg> Resumen</a>
        <a href="/panel/productos.html"><svg class="icon"><use href="/img/icons.svg#flower"></use></svg> Productos</a>
        <a href="/panel/pedidos.html"><svg class="icon"><use href="/img/icons.svg#box"></use></svg> Pedidos</a>
        <a href="/panel/usuarios.html"><svg class="icon"><use href="/img/icons.svg#users"></use></svg> Usuarios</a>
        <a href="/panel/resenas.html"><svg class="icon"><use href="/img/icons.svg#star"></use></svg> Reseñas</a>
        <a href="/panel/empresas.html"><svg class="icon"><use href="/img/icons.svg#building"></use></svg> Empresas</a>
      </aside>
      <div id="panelRoot">
        <div id="empresasRoot">
          <h1>Empresas</h1>
          <p class="subtitle">El superadmin crea una empresa y su primer administrador. Cada empresa tiene su catálogo, pedidos y usuarios separados.</p>

          <div class="card" style="margin-bottom:24px">
            <h3>Nueva empresa</h3>
            <form id="companyForm">
              <div class="grid two">
                <div class="field"><label for="cname">Nombre de la empresa</label><input id="cname" name="name" required placeholder="Ej. Flores de Luján"></div>
                <div class="field"><label for="cslug">Slug (para la URL)</label><input id="cslug" name="slug" required placeholder="flores-de-lujan"></div>
              </div>
              <h4>Administrador de la empresa</h4>
              <div class="grid two">
                <div class="field"><label for="cadminname">Nombre</label><input id="cadminname" name="adminName" required></div>
                <div class="field"><label for="cadminemail">Email</label><input id="cadminemail" name="adminEmail" type="email" required></div>
              </div>
              <div class="field"><label for="cadminpass">Contraseña</label><input id="cadminpass" name="adminPassword" type="password" required minlength="6"></div>
              <button class="btn btn-primary btn-block" type="submit">Crear empresa</button>
            </form>
          </div>

          <div class="card">
            <div class="table-wrap">
              <table>
                <thead><tr><th>Empresa</th><th>Slug</th><th>Estado</th></tr></thead>
                <tbody id="companyList"></tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <div id="site-footer"></div>
  <script src="/js/api.js"></script>
  <script src="/js/cart.js"></script>
  <script src="/js/layout.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
